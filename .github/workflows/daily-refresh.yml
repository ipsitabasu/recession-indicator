name: Daily Refresh

on:
  schedule:
    # 06:00 UTC every day — pre-US-market-open
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Refresh indicators
        run: python refresh.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit data snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: daily refresh'
          file_pattern: 'data/*.csv data/*.json'
          commit_user_name: 'recession-tracker-bot'
          commit_user_email: 'bot@users.noreply.github.com'
